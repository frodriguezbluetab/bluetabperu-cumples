name: Automatizacion de Tarjetas

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (2:00 AM hora de Lima)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecutar el bot manualmente desde GitHub

jobs:
  generar-tarjetas:
    runs-on: ubuntu-latest

    steps:
    - name: Clonar el repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar dependencias del sistema (poppler)
      run: |
        sudo apt-get update
        sudo apt-get install -y poppler-utils

    - name: Instalar librerías de Python
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ejecutar script de Cumpleaños
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python generar_cumples.py

    - name: Ejecutar script de Aniversarios
      env:
        GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
      run: python generar_aniversarios.py